# Lint, type-check and build on every push and pull request, so a broken build
# shows up as a red X on the commit before (or as) it deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run stylelint

      - name: Build (includes type-check)
        run: npm run build
