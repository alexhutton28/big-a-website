# Weekly pull requests to keep dependencies current. Security fixes are opened as
# soon as an advisory is published once Dependabot security updates are enabled
# in the repo's Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major upgrades (e.g. TypeScript 7, ESLint 10) are done deliberately, not by bot.
    # Security fixes are almost always minor/patch releases, so they still arrive.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      # Batch routine minor/patch bumps into one PR instead of one per package
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
